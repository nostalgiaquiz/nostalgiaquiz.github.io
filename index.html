    ["ישראל והעולם", "מי היה ראש ממשלת ישראל בעת חתימת הסכמי אוסלו ב-1993?", "יצחק רבין", "שמעון פרס", "יצחק שמיר", "בנימין נתניהו"],
    ["ישראל והעולם", "באיזו שנה נפתח הקניון המודרני הראשון בישראל?", "1985", "1977", "1990", "1993"],
    ["ישראל והעולם", "מי טבע את המילה 'קניון' מהצירוף קניות וחניון?", "דוד עזריאלי", "שרי אריסון", "יצחק תשובה", "נוחי דנקנר"],
    ["ישראל והעולם", "באיזה קניון נפתח הסניף הראשון של מקדונלד'ס בישראל ב-1993?", "קניון איילון", "דיזנגוף סנטר", "קניון הזהב", "קניון רננים"],
    ["צעצועים ותרבות", "כמה צבעים שונים יש בקוביית רוביק הקלאסית?", "שישה", "ארבעה", "חמישה", "שמונה"]
    ]
  };
  /* ===== END QUESTIONS ===== */

  var TIERS = [
    { min: 45, emo: "👑", title: "מלך השכונה", msg: "אלוהי הנוסטלגיה! היית מלך השכונה, ידעת הכול – מהקיוסק ועד ערוץ הילדים!" },
    { min: 35, emo: "🏆", title: "זיכרון פנטסטי", msg: "וואו! זיכרון פנטסטי. ברור שגדלת על במבה, קלטות וידאו ושעות מול הטלוויזיה." },
    { min: 25, emo: "😎", title: "ותיק ומנוסה", msg: "לא רע בכלל! יש לך זיכרון טוב, אבל כמה דברים עוד חמקו לך מהילדות." },
    { min: 15, emo: "🤔", title: "הזיכרון קצת חלוד", msg: "הזיכרון קצת חלוד... זמן לשבת עם חברים ולהעלות זיכרונות מהשכונה." },
    { min: 0, emo: "📼", title: "צריך לרענן קלטת", msg: "נראה שפספסת את הילדות שלנו... תנסו שוב, ואולי תשאלו את ההורים!" }
  ];
  var LETTERS = ["א", "ב", "ג", "ד"];

  var qs, idx, score, locked, tier, shareText, cardBlob, timer, t0, mode;
  var TIME = 30; /* שניות לכל שאלה */
  var $ = function (id) { return document.getElementById(id); };

  function shuffle(a) {
    var i, j, t;
    for (i = a.length - 1; i > 0; i--) {
      j = Math.floor(Math.random() * (i + 1));
      t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.remove("hide");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.add("hide"); }, 3500);
  }

  /* מצב "מוכנים?": השאלה הראשונה מוצגת, אבל התשובות נעולות והטיימר לא רץ עד הלחיצה על הכפתור */
  function setAnswersDisabled(d) {
    var all = $("answers").children, i;
    for (i = 0; i < all.length; i++) all[i].disabled = d;
  }

  function start() {
    stopTimer();
    qs = shuffle(DAILY.questions.map(function (r) { return { cat: r[0], q: r.slice(1) }; }));
    idx = 0; score = 0; mode = "ready";
    $("dl").textContent = "החידון של " + DAILY.label;
    $("result").classList.add("hide");
    $("quiz").classList.remove("hide");
    show();
    stopTimer();
    drawPizza(1, TIME);
    locked = true;
    setAnswersDisabled(true);
    $("qtext").classList.add("blur");
    $("answers").classList.add("blur");
    $("next").textContent = "מוכנים? יאללה, מתחילים! 🚀";
    $("next").classList.remove("hide");
  }

  function show() {
    var item = qs[idx], q = item.q, i, opts = [], box = $("answers");
    locked = false;
    $("cnt").textContent = "שאלה " + (idx + 1) + " מתוך " + qs.length;
    $("fill").style.width = (idx / qs.length * 100) + "%";
    $("sc").textContent = score;
    $("tag").classList.remove("hide");
    $("tag").textContent = item.cat;
    $("qtext").textContent = q[0];
    $("next").classList.add("hide");
    $("next").textContent = (idx === qs.length - 1) ? "לתוצאה הסופית 🏁" : "לשאלה הבאה 👈";
    for (i = 1; i < 5; i++) opts.push({ t: q[i], ok: i === 1 });
    shuffle(opts);
    box.innerHTML = "";
    opts.forEach(function (o, n) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "ans";
      b.innerHTML = "<i>" + LETTERS[n] + "</i><span></span>";
      b.lastChild.textContent = o.t;
      b._ok = o.ok;
      b.onclick = function () { pick(b, o.ok); };
      box.appendChild(b);
    });
    startTimer();
  }

  function pick(btn, ok) {
    if (locked) return;
    locked = true;
    stopTimer();
    var all = $("answers").children, i;
    for (i = 0; i < all.length; i++) {
      all[i].disabled = true;
      if (all[i]._ok) { all[i].classList.add("ok"); all[i].firstChild.textContent = "✓"; }
    }
    if (ok) {
      score++;
      var p = $("plus"); p.classList.remove("go"); void p.offsetWidth; p.classList.add("go");
    } else {
      btn.classList.add("bad"); btn.firstChild.textContent = "✗";
    }
    $("sc").textContent = score;
    $("fill").style.width = ((idx + 1) / qs.length * 100) + "%";
    $("next").classList.remove("hide");
  }

  /* ===== טיימר פיצה: ירוק -> אדום בהדרגה, ו"פרוסה" נאכלת עם הזמן ===== */
  function drawPizza(f, sec) {
    var a = f * 2 * Math.PI, r = 17, d;
    if (f >= 0.999) {
      d = "M22 5 A17 17 0 1 1 22 39 A17 17 0 1 1 22 5 Z";
    } else if (f <= 0.001) {
      d = "M22 22 Z";
    } else {
      d = "M22 22 L22 5 A17 17 0 " + (a > Math.PI ? 1 : 0) + " 1 " +
          (22 + r * Math.sin(a)).toFixed(2) + " " + (22 - r * Math.cos(a)).toFixed(2) + " Z";
    }
    $("nqw").setAttribute("d", d);
    $("nqc").setAttribute("d", d);
    $("nqw").setAttribute("fill", "hsl(" + Math.round(120 * f) + ",72%,46%)");
    $("nqt").textContent = sec;
    $("pz").classList.toggle("warn", sec <= 5 && sec > 0);
  }
  function stopTimer() { clearInterval(timer); }
  function startTimer() {
    stopTimer();
    t0 = Date.now();
    drawPizza(1, TIME);
    timer = setInterval(function () {
      var left = TIME - (Date.now() - t0) / 1000;
      if (left <= 0) { stopTimer(); drawPizza(0, 0); timeUp(); return; }
      drawPizza(left / TIME, Math.ceil(left));
    }, 100);
  }
  function timeUp() {
    if (locked) return;
    locked = true;
    var all = $("answers").children, i;
    for (i = 0; i < all.length; i++) {
      all[i].disabled = true;
      if (all[i]._ok) { all[i].classList.add("ok"); all[i].firstChild.textContent = "✓"; }
    }
    $("fill").style.width = ((idx + 1) / qs.length * 100) + "%";
    $("next").classList.remove("hide");
    toast("⏰ נגמר הזמן! התשובה הנכונה מסומנת בירוק");
  }

  $("next").onclick = function () {
    if (mode === "ready") {
      mode = "play"; locked = false;
      setAnswersDisabled(false);
      $("qtext").classList.remove("blur");
      $("answers").classList.remove("blur");
      $("next").classList.add("hide");
      startTimer();
      return;
    }
    idx++;
    if (idx >= qs.length) finish(); else show();
    window.scrollTo(0, $("nq").offsetTop);
  };

  /* ===== כרטיס תוצאה כתמונה (לשיתוף בפייסבוק ובוואטסאפ) ===== */
  function drawCard(cb) {
    var c = document.createElement("canvas"), x, W = 1080;
    c.width = W; c.height = W;
    x = c.getContext("2d");
    function paint() {
      var cols = ["#e8423f", "#ffc93c", "#1b998b", "#1f2a44"], i;
      x.fillStyle = "#fff4dc"; x.fillRect(0, 0, W, W);
      for (i = 0; i < 4; i++) { x.fillStyle = cols[i]; x.fillRect(0, i * 22, W, 22); x.fillRect(0, W - 88 + i * 22, W, 22); }
      x.fillStyle = "#fff"; x.strokeStyle = "#1f2a44"; x.lineWidth = 8;
      x.fillRect(70, 150, W - 140, 780); x.strokeRect(70, 150, W - 140, 780);
      x.direction = "rtl"; x.textAlign = "center"; x.fillStyle = "#1f2a44";
      x.font = "800 72px Rubik, Arial"; x.fillText("חידון הנוסטלגיה של פעם", W / 2, 250);
      x.font = "500 40px Rubik, Arial"; x.fillText("שנות ה-80 וה-90 בישראל ובעולם", W / 2, 310);
      x.font = "130px Arial"; x.fillText(tier.emo, W / 2, 470);
      x.font = "800 190px Rubik, Arial"; x.fillText(score + "/" + qs.length, W / 2, 680);
      x.fillStyle = "#e8423f"; x.font = "800 66px Rubik, Arial"; x.fillText(tier.title, W / 2, 790);
      x.fillStyle = "#1f2a44"; x.font = "500 38px Rubik, Arial"; x.fillText("מי מצליח לנצח אותי? 👇", W / 2, 870);
      x.font = "500 30px Rubik, Arial"; x.fillText(location.host, W / 2, 1000);
      c.toBlob(function (b) { cb(b); }, "image/png");
    }
    if (document.fonts && document.fonts.load) {
      document.fonts.load("800 60px Rubik").then(paint, paint);
    } else { paint(); }
  }

  function finish() {
    var n = qs.length, i, url = location.href.split("#")[0];
    stopTimer();
    $("fill").style.width = "100%";
    for (i = 0; i < TIERS.length; i++) { if (score >= TIERS[i].min) { tier = TIERS[i]; break; } }
    $("quiz").classList.add("hide");
    $("result").classList.remove("hide");
    $("remo").textContent = tier.emo;
    $("rsc").textContent = "התוצאה שלך: " + score + " מתוך " + n;
    $("rtx").textContent = tier.msg;

    shareText = tier.emo + " עניתי נכון על " + score + " מתוך " + n + " שאלות בחידון הנוסטלגיה של שנות ה-80 וה-90! מי מצליח לנצח אותי? 👇\n" + url;
    $("shFb").href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(url) + "&quote=" + encodeURIComponent(shareText.split("\n")[0]);
    $("shWa").href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);

    cardBlob = null;
    $("cardImg").removeAttribute("src");
    drawCard(function (b) {
      cardBlob = b;
      if (b) $("cardImg").src = URL.createObjectURL(b);
    });
  }

  /* העתקת טקסט התוצאה – להדבקה כתגובה בקבוצה */
  $("shCopy").onclick = function () {
    if (GROUP_POST_URL) window.open(GROUP_POST_URL, "_blank");
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = shareText; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("לא הצלחנו להעתיק. סמנו והעתיקו ידנית."); }
      document.body.removeChild(ta);
    }
    function done() { toast("הועתק! הדביקו את התוצאה כתגובה בפוסט החידון בקבוצה 📋"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareText).then(done, fallback);
    } else { fallback(); }
  };

  /* שיתוף התמונה: בטלפון נפתח תפריט השיתוף (פייסבוק, וואטסאפ ועוד); אחרת מורידים את הקובץ */
  $("shImg").onclick = function () {
    if (!cardBlob) { toast("התמונה עדיין נוצרת, נסו שוב בעוד רגע"); return; }
    var file;
    try { file = new File([cardBlob], "nostalgia-score.png", { type: "image/png" }); } catch (e) { file = null; }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], text: shareText }).catch(function () {});
    } else {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(cardBlob); a.download = "nostalgia-score.png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast("התמונה נשמרה. אם לא, לחצו עליה לחיצה ארוכה ושמרו.");
    }
  };

  $("again").onclick = function () { start(); window.scrollTo(0, $("nq").offsetTop); };

  start();
})();
</script>
